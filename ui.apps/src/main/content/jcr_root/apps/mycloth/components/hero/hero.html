<div class="cmp-hero">
    <section class="cmp-hero">
        <div class="cmp-hero__inner">
            <div class="cmp-hero__content">
                <p class="cmp-hero__eyecatcher">${properties.eyecatcher}</p>
                <h1 class="cmp-hero__title">${properties.headline}</h1>
                <p class="cmp-hero__subtitle">${properties.subheadline}</p>
            </div>
            <div class="cmp-hero__media">
                <img
                    class="cmp-hero__image"
                    src="${properties.heroImage @ context='uri'}"
                    alt="${properties.heroImageAlt}">
        </div>
        </div>
    </section>
<section class="cmp-hero__stats">
    <div class="cmp-hero__stats-inner">
        <div class="cmp-hero__stat">
            <strong>12.4k+</strong>
            <span>Accounts</span>
        </div>
        <div class="cmp-hero__stat">
            <strong>1,200+</strong>
            <span>SKUs</span>
        </div>
        <div class="cmp-hero__stat">
            <strong>₹84 Cr+</strong>
            <span>GMV</span>
        </div>
    </div>
</section>
</div>
