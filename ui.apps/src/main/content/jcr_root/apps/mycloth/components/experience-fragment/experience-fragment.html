<sly data-sly-test="${wcmmode.edit}">
    <p data-emptytext="${component.title}">
        ${component.title}
    </p>
</sly>

<!-- Component CSS -->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
    <sly data-sly-call="${clientlib.css @ categories='mycloth.components.experience-fragment'}"/>
</sly>

<!-- Existing Sling Model -->
<sly data-sly-use.navigation="com.mycloth.core.models.MainNavigationImp"/>

<!-- Main navigation (Passing the raw resource path) -->
<nav class="cmp-nav"
     aria-label="Main navigation"
     data-servlet-url="${resource.path}">

    <!-- Mobile hamburger button -->
    <button class="cmp-nav__toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
    </button>

    <!-- Parent categories from the component dialog -->
    <ul class="cmp-nav__list"
        data-sly-list.item="${navigation.items}">

        <li class="cmp-nav__item"
            data-category-path="${item.path}"
            data-category-depth="${item.depth}">

            <!-- Parent page link -->
            <a class="cmp-nav__link"
               href="${item.path @ extension='html'}"
               aria-haspopup="true"
               aria-expanded="false">

                <span class="cmp-nav__title">${item.title}</span>
                <span class="cmp-nav__arrow" aria-hidden="true">⌄</span>
            </a>

            <!-- AJAX-loaded child pages -->
            <div class="cmp-nav__dropdown" hidden>
                <ul class="cmp-nav__dropdown-list">
                </ul>
            </div>

        </li>
    </ul>

</nav>

<!-- Component JavaScript -->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
    <sly data-sly-call="${clientlib.js @ categories='mycloth.components.experience-fragment'}"/>
</sly>
