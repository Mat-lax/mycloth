<sly data-sly-test="${wcmmode.edit}">
    <p class="cq-placeholder" data-emptytext="${component.title}">
        ${component.title}
    </p>
</sly>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
    <sly data-sly-call="${clientlib.css @ categories='mycloth.components.myclothsuggestions'}"/>
    <sly data-sly-call="${clientlib.js @ categories='mycloth.components.myclothsuggestions'}"/>
</sly>

<section class="suggestion"
         id="${properties.anchorId}"
         data-suggestion
         data-servlet-url="${resource.path}.suggestion.json">

    <h2 data-sly-test="${properties.title}">
        ${properties.title}
    </h2>

    <ul class="overview__list"
        data-suggestion-list
        aria-live="polite">
        <li>Loading pages...</li>
    </ul>

</section>
